<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Aditya Prasad Pathak — Principal Software Engineer</title>
  <desc id="d">Dark banner with the name, title and focus areas: Java, cloud-native engineering, AI and digital trust.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="0.6" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- abstract node graph (distributed systems motif) -->
  <g stroke="url(#accent)" stroke-width="1.5" fill="none" opacity="0.55">
    <path d="M900 70 L1010 130 L1130 80 L1200 170 L1090 230 L960 210 L900 70"/>
    <path d="M1010 130 L1090 230"/>
    <path d="M1130 80 L1090 230"/>
  </g>
  <g fill="#0d1117" stroke="url(#accent)" stroke-width="2">
    <circle cx="900" cy="70" r="7"/>
    <circle cx="1010" cy="130" r="9"/>
    <circle cx="1130" cy="80" r="7"/>
    <circle cx="1200" cy="170" r="8"/>
    <circle cx="1090" cy="230" r="10"/>
    <circle cx="960" cy="210" r="7"/>
  </g>

  <rect x="80" y="86" width="64" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="150" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#f0f6fc">Aditya Prasad Pathak</text>
  <text x="80" y="195" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#58a6ff">Principal Software Engineer · DigiCert</text>
  <text x="80" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#8b949e" letter-spacing="0.5">Java  ·  Cloud-native systems  ·  AI engineering  ·  Digital trust</text>
</svg>
